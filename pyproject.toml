[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-agent"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.15,<1",
  "rich>=13,<15",
  "prompt-toolkit>=3.0,<4",
]

[project.scripts]
agent = "cli:app"

[tool.setuptools]
py-modules = ["agent", "cli"]

[tool.setuptools.packages.find]
include = ["core*", "interfaces*", "security*", "storage*", "ui*"]
